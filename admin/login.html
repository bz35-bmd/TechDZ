<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin.loginTitle">Admin — TechDZ</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="login-page">
    <div class="theme-picker theme-picker-fixed">
    <button class="theme-picker-btn" id="themePickerBtn" aria-label="Choisir le thème" data-i18n-aria="theme.choose" aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-palette"></i>
    </button>
    <div class="theme-picker-menu" id="themePickerMenu" role="menu">
        <div class="theme-picker-header" data-i18n="theme.title">Thème du site</div>
        <button class="theme-option" data-theme-option="code" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-code"></span>
            <span class="theme-option-text"><strong data-i18n="theme.code">Code</strong><small data-i18n="theme.codeDesc">Encre liquide + &lt;/&gt;</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="signal" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-signal"></span>
            <span class="theme-option-text"><strong data-i18n="theme.signal">Signal</strong><small data-i18n="theme.signalDesc">Réseau + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="fusion" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-fusion"></span>
            <span class="theme-option-text"><strong data-i18n="theme.fusion">Fusion</strong><small data-i18n="theme.fusionDesc">Encre + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="dunes" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-dunes"></span>
            <span class="theme-option-text"><strong data-i18n="theme.dunes">Dunes</strong><small data-i18n="theme.dunesDesc">Sahara + réseau or</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="nuit" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-nuit"></span>
            <span class="theme-option-text"><strong data-i18n="theme.nuit">Nuit</strong><small data-i18n="theme.nuitDesc">Étoiles + réseau indigo</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
    </div>
</div>
<div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../assets/img/logo.svg" alt="TechDZ" height="32">
                <h1 data-i18n="admin.loginHeading">Administration</h1>
                <p data-i18n="admin.loginSub">Connectez-vous pour gérer la plateforme</p>
            </div>
            <div class="alert error" id="alertError"></div>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email"><span data-i18n="admin.email">Email</span></label>
                    <input type="email" id="email" placeholder="admin@techdz.com" required>
                </div>
                <div class="form-group">
                    <label for="password"><span data-i18n="common.password">Mot de passe</span></label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div id="turnstile-widget"></div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="common.signin">Se connecter</span>
                </button>
            </form>
            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> <span data-i18n="admin.backToSite">Retour au site</span></a>
                <div style="display:flex; gap:8px; justify-content:center; margin-top:12px; font-size:0.8rem;">
                    <a href="login.html?lang=fr" style="color:var(--text-muted); text-decoration:none;">FR</a>
                    <a href="login.html?lang=en" style="color:var(--text-muted); text-decoration:none;">EN</a>
                    <a href="login.html?lang=ar" style="color:var(--text-muted); text-decoration:none;">AR</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/auth.js?v=20260807"></script>
    <script src="../assets/js/translations.js?v=20260807"></script>
    <script src="../assets/js/i18n.js?v=20260807"></script>
    <script src="../assets/js/db.js?v=20260807"></script>
    <script>
        Auth.init();

        const form = document.getElementById('loginForm');
        const alertError = document.getElementById('alertError');
        const loginBtn = document.getElementById('loginBtn');

        // Check if already logged in as admin
        Auth.getUser().then(async ({ user }) => {
            if (user) {
                const isAdmin = await Auth.isAdmin(user.id);
                if (isAdmin) window.location.href = 'index.html';
            }
        });

        // ==========================================
        // Cloudflare Turnstile — protection anti-bots
        // ==========================================
        let captchaToken = null;
        let captchaReady = false;
        window.__turnstileWidgetId = null;
        window.turnstileCallback = (token) => { captchaToken = token; };
        window.turnstileExpiredCallback = () => { captchaToken = null; };
        window.turnstileErrorCallback = () => { captchaToken = null; captchaReady = false; };

        // Le captcha n'est exigé que si une vraie Site Key est configurée
        function turnstileEnabled() {
            return !!window.TURNSTILE_SITE_KEY && !window.TURNSTILE_SITE_KEY.startsWith('VOTRE_');
        }

        function waitForTurnstile(timeoutMs) {
            return new Promise((resolve) => {
                const start = Date.now();
                const check = () => {
                    if (window.turnstile && typeof window.turnstile.render === 'function') return resolve(true);
                    if (Date.now() - start > timeoutMs) return resolve(false);
                    setTimeout(check, 100);
                };
                check();
            });
        }

        // Recharger le script API s'il a échoué (réseau lent, blocage temporaire…)
        function reloadTurnstileScript() {
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.async = true;
            document.head.appendChild(s);
        }

        function renderTurnstile() {
            const id = Auth.renderTurnstile();
            captchaReady = !!id;
            if (!id) {
                alertError.textContent = t('captcha.loadError');
                alertError.style.display = 'block';
            }
        }

        async function initTurnstile() {
            if (!turnstileEnabled()) return;
            let loaded = await waitForTurnstile(8000);
            if (!loaded) reloadTurnstileScript();
            loaded = await waitForTurnstile(8000);
            if (!loaded) {
                // API indisponible (réseau) : on ne bloque pas le formulaire et
                // on réessaie en arrière-plan dès que l'API est accessible.
                console.warn('Turnstile API unavailable — captcha temporarily skipped');
                const retry = setInterval(() => {
                    if (window.turnstile && typeof window.turnstile.render === 'function') {
                        clearInterval(retry);
                        renderTurnstile();
                        if (alertError.style.display === 'block') alertError.style.display = 'none';
                    }
                }, 2000);
                setTimeout(() => clearInterval(retry), 30000);
                return;
            }
            renderTurnstile();
        }

        initTurnstile();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Turnstile requis mais non validé → bloquer la soumission
            if (turnstileEnabled()) {
                if (!captchaReady) { alertError.textContent = t('captcha.loading'); alertError.style.display = 'block'; return; }
                if (!captchaToken) { alertError.textContent = t('captcha.complete'); alertError.style.display = 'block'; return; }
            }

            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('admin.connecting');
            loginBtn.disabled = true;
            alertError.style.display = 'none';

            const { data, error } = await Auth.signIn(email, password, captchaToken);

            if (error) {
                // Token consommé ou invalide → régénérer le captcha
                captchaToken = null;
                Auth.resetCaptcha();
                alertError.textContent = error.message.includes('Invalid login') ? t('admin.loginError') : error.message;
                alertError.style.display = 'block';
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ' + t('common.signin');
                loginBtn.disabled = false;
                return;
            }

            const isAdmin = await Auth.isAdmin(data.user.id);
            if (!isAdmin) {
                captchaToken = null;
                Auth.resetCaptcha();
                alertError.textContent = t('admin.notAdmin');
                alertError.style.display = 'block';
                await Auth.signOut();
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ' + t('common.signin');
                loginBtn.disabled = false;
                return;
            }

            captchaToken = null;
            Auth.resetCaptcha();
            window.location.href = 'index.html';
        });
    </script>
<script src="../assets/js/effects/themes.js" defer data-base="../"></script>
</body>
</html>
