<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Code bracket icon: accolades de code (communauté de développeurs) -->
  <g transform="translate(5, 10)">
    <!-- Left bracket -->
    <path d="M12 5 L5 15 L12 25" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right bracket -->
    <path d="M28 5 L35 15 L28 25" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Slash -->
    <line x1="22" y1="3" x2="18" y2="27" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text TechDZ -->
  <text x="52" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#blueGrad)" letter-spacing="-0.5">Tech</text>
  <text x="128" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#greenGrad)" letter-spacing="-0.5">DZ</text>

  <!-- Algeria flag -->
  <rect x="186" y="13" width="52" height="34" rx="3" fill="#FFFFFF"/>
  <path d="M188.5 13H207v34h-18.5A2.5 2.5 0 0 1 186 44.5v-29a2.5 2.5 0 0 1 2.5-2.5z" fill="#006633"/>
  <path d="M216.06 25.5 a8.5 8.5 0 1 0 0 8.5 a6.8 6.8 0 1 1 0 -8.5" fill="#D21034"/>
  <path d="M216.4 30 L209 27.45 L213.5 33.5 V26.5 L209 32.55 Z" fill="#D21034"/>
</svg>
