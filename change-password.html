<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.change">Nouveau mot de passe — TechDZ</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .auth-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            filter: blur(60px);
        }
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo img { height: 36px; }
        .auth-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 12px;
        }
        .auth-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-group input {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .form-group .error-text {
            color: var(--red);
            font-size: 0.8rem;
            display: none;
        }
        .form-group.error input { border-color: var(--red); }
        .form-group.error .error-text { display: block; }
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            display: none;
            line-height: 1.6;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--red);
        }
        .alert.error a { color: var(--red); font-weight: 700; text-decoration: underline; }
        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--secondary);
        }
        .alert.success .check-icon {
            display: block;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--secondary);
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 12px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <a href="login.html" class="back-link">
        <i class="fas fa-arrow-left"></i> <span data-i18n="common.back">Retour</span>
    </a>
<div class="theme-picker theme-picker-fixed">
    <button class="theme-picker-btn" id="themePickerBtn" aria-label="Choisir le thème" data-i18n-aria="theme.choose" aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-palette"></i>
    </button>
    <div class="theme-picker-menu" id="themePickerMenu" role="menu">
        <div class="theme-picker-header" data-i18n="theme.title">Thème du site</div>
        <button class="theme-option" data-theme-option="code" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-code"></span>
            <span class="theme-option-text"><strong data-i18n="theme.code">Code</strong><small data-i18n="theme.codeDesc">Encre liquide + &lt;/&gt;</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="signal" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-signal"></span>
            <span class="theme-option-text"><strong data-i18n="theme.signal">Signal</strong><small data-i18n="theme.signalDesc">Réseau + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="fusion" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-fusion"></span>
            <span class="theme-option-text"><strong data-i18n="theme.fusion">Fusion</strong><small data-i18n="theme.fusionDesc">Encre + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="dunes" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-dunes"></span>
            <span class="theme-option-text"><strong data-i18n="theme.dunes">Dunes</strong><small data-i18n="theme.dunesDesc">Sahara + réseau or</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="nuit" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-nuit"></span>
            <span class="theme-option-text"><strong data-i18n="theme.nuit">Nuit</strong><small data-i18n="theme.nuitDesc">Étoiles + réseau indigo</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
    </div>
</div>

    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-card">
            <div class="auth-logo">
                <img src="logo.svg" alt="TechDZ">
                <h1 data-i18n="change.title">Nouveau mot de passe</h1>
                <p data-i18n="change.subtitle">Choisissez un nouveau mot de passe pour votre compte</p>
            </div>

            <div id="statusBox">
                <div class="alert" id="alertMessage"></div>
                <div class="loading" id="loadingBox">
                    <i class="fas fa-spinner fa-spin"></i> <span data-i18n="change.verifying">Vérification de votre lien...</span>
                </div>
            </div>

            <form class="auth-form" id="passwordForm" style="display:none">
                <div class="form-group" id="passwordGroup">
                    <label for="password" data-i18n="change.newPassword">Nouveau mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                    <span class="error-text"></span>
                </div>
                <div class="form-group" id="confirmGroup">
                    <label for="confirm" data-i18n="change.confirm">Confirmer le mot de passe</label>
                    <input type="password" id="confirm" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                    <span class="error-text"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="updateBtn">
                    <i class="fas fa-key"></i> <span data-i18n="change.update">Mettre à jour le mot de passe</span>
                </button>
            </form>

            <div class="auth-footer" id="authFooter" style="display:none">
                <a href="login.html"><i class="fas fa-sign-in-alt"></i> <span data-i18n="auth.gotoLogin">Aller à la connexion</span></a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js?v=20260807"></script>
    <script src="translations.js?v=20260807"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || localStorage.getItem('techdz-lang') || 'fr';
            localStorage.setItem('techdz-lang', lang);
            const tr = window.translations;
            const data = (tr && tr[lang]) || (tr && tr.fr) || {};
            if (lang === 'ar') document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', lang);
            const apply = (attr, set) => document.querySelectorAll('[' + attr + ']').forEach(el => {
                const k = el.getAttribute(attr);
                if (data[k]) set(el, data[k]);
            });
            apply('data-i18n', (el, v) => el.textContent = v);
            apply('data-i18n-placeholder', (el, v) => el.placeholder = v);
            apply('data-i18n-title', (el, v) => el.title = v);
            apply('data-i18n-aria', (el, v) => el.setAttribute('aria-label', v));
            window.t = function (key, fb) {
                const v = data[key];
                return (v !== undefined && v !== null && v !== '') ? v : (fb !== undefined ? fb : key);
            };
        })();
    </script>
    <script src="db.js?v=20260807"></script>
    <script>
        Auth.init();

        const alertMessage = document.getElementById('alertMessage');
        const loadingBox = document.getElementById('loadingBox');
        const authFooter = document.getElementById('authFooter');
        const passwordForm = document.getElementById('passwordForm');

        function showError(msg) {
            loadingBox.style.display = 'none';
            alertMessage.className = 'alert error';
            alertMessage.innerHTML = msg + ' <a href="login.html">' + t('auth.backToLogin') + '</a>';
            alertMessage.style.display = 'block';
            authFooter.style.display = 'block';
        }

        function showSuccess(msg) {
            loadingBox.style.display = 'none';
            alertMessage.className = 'alert success';
            alertMessage.innerHTML = '<i class="fas fa-check-circle check-icon"></i>' + msg;
            alertMessage.style.display = 'block';
        }

        // Session de récupération obtenue → afficher le formulaire
        function showPasswordForm() {
            loadingBox.style.display = 'none';
            passwordForm.style.display = 'flex';
            authFooter.style.display = 'none';
        }

        async function resolveRecoverySession() {
            // 1) Flow PKCE : échange du code de récupération s'il est présent dans l'URL
            const code = new URLSearchParams(window.location.search).get('code');
            if (code) {
                const { data, error } = await Auth.getClient().auth.exchangeCodeForSession(code);
                if (error) {
                    showError(t('change.invalid'));
                    return;
                }
                showPasswordForm();
                return;
            }

            // 2) Flow implicite : session déjà disponible (jetons dans le hash de l'URL)
            const { session } = await Auth.getSession();
            if (session) {
                showPasswordForm();
                return;
            }

            // 3) Attente courte au cas où le hash est encore en cours de traitement
            setTimeout(async () => {
                const s = (await Auth.getSession()).session;
                if (s) showPasswordForm();
                else showError(t('change.invalid'));
            }, 1500);
        }

        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const passwordGroup = document.getElementById('passwordGroup');
            const confirmGroup = document.getElementById('confirmGroup');

            passwordGroup.classList.remove('error');
            confirmGroup.classList.remove('error');

            if (password.length < 6) {
                passwordGroup.classList.add('error');
                passwordGroup.querySelector('.error-text').textContent = t('change.short');
                return;
            }
            if (password !== confirm) {
                confirmGroup.classList.add('error');
                confirmGroup.querySelector('.error-text').textContent = t('register.mismatch');
                return;
            }

            const updateBtn = document.getElementById('updateBtn');
            updateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('change.updating');
            updateBtn.disabled = true;

            const { error } = await Auth.updatePassword(password);
            console.log('Password update:', { error });

            if (error) {
                showError(error.message || t('change.error'));
                updateBtn.innerHTML = '<i class="fas fa-key"></i> ' + t('change.update');
                updateBtn.disabled = false;
                return;
            }

            // Déconnexion de la session de récupération, puis retour à la connexion
            try { await Auth.signOut(null); } catch (e) {}
            localStorage.removeItem('techdz-user');
            passwordForm.style.display = 'none';
            showSuccess(t('change.success'));
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });

        resolveRecoverySession();
    </script>
<script src="assets/themes.js" defer data-base=""></script>
</body>
</html>
