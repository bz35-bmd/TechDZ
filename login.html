<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.login">Connexion — TechDZ</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=20260819">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .auth-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            filter: blur(60px);
        }
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo img { height: 36px; }
        .auth-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 12px;
        }
        .auth-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-group input {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .form-group .error-text {
            color: var(--red);
            font-size: 0.8rem;
            display: none;
        }
        .form-group.error input { border-color: var(--red); }
        .form-group.error .error-text { display: block; }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 4px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin: 0 auto;
            padding: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .btn-google:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: scale(1.05);
        }
        .btn-google img { width: 20px; height: 20px; }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-top: -8px;
        }
        .forgot-link:hover { text-decoration: underline; }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            display: none;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--red);
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--secondary);
        }
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> <span data-i18n="common.back">Retour</span>
    </a>
<div class="theme-picker theme-picker-fixed">
    <button class="theme-picker-btn" id="themePickerBtn" aria-label="Choisir le thème" data-i18n-aria="theme.choose" aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-palette"></i>
    </button>
    <div class="theme-picker-menu" id="themePickerMenu" role="menu">
        <div class="theme-picker-header" data-i18n="theme.title">Thème du site</div>
        <button class="theme-option" data-theme-option="code" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-code"></span>
            <span class="theme-option-text"><strong data-i18n="theme.code">Code</strong><small data-i18n="theme.codeDesc">Encre liquide + &lt;/&gt;</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="signal" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-signal"></span>
            <span class="theme-option-text"><strong data-i18n="theme.signal">Signal</strong><small data-i18n="theme.signalDesc">Réseau + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="fusion" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-fusion"></span>
            <span class="theme-option-text"><strong data-i18n="theme.fusion">Fusion</strong><small data-i18n="theme.fusionDesc">Encre + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="dunes" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-dunes"></span>
            <span class="theme-option-text"><strong data-i18n="theme.dunes">Dunes</strong><small data-i18n="theme.dunesDesc">Sahara + réseau or</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="nuit" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-nuit"></span>
            <span class="theme-option-text"><strong data-i18n="theme.nuit">Nuit</strong><small data-i18n="theme.nuitDesc">Étoiles + réseau indigo</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
    </div>
</div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="assets/img/logo.svg" alt="TechDZ">
                <h1 data-i18n="common.welcome">Bienvenue</h1>
                <p data-i18n="login.title">Connectez-vous à votre compte</p>
            </div>

            <div class="alert error" id="alertError"></div>
            <div class="alert success" id="alertSuccess"></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group" id="emailGroup">
                    <label for="email" data-i18n="reset.email">Email</label>
                    <input type="email" id="email" data-i18n-placeholder="reset.emailPlaceholder" placeholder="votre@email.com" required>
                    <span class="error-text"></span>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="password" data-i18n="common.password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                    <span class="error-text"></span>
                </div>
                <div id="turnstile-widget"></div>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="common.signin">Se connecter</span>
                </button>
                <a href="reset-password.html" class="forgot-link" data-i18n="login.forgot">Mot de passe oublié ?</a>
            </form>

            <div class="divider" data-i18n="common.or">ou</div>

            <button class="btn-google" id="googleBtn" data-i18n-aria="common.signinGoogle">
                <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            </button>

            <div class="auth-footer">
                <span data-i18n="login.noAccount">Pas encore de compte ?</span> <a href="register.html" data-i18n="login.createAccount">Créer un compte</a>
            </div>
        </div>
    </div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js?v=20260807"></script>
    <script src="assets/js/translations.js?v=20260807"></script>
    <script src="assets/js/i18n.js?v=20260807"></script>
    <script src="assets/js/db.js?v=20260807"></script>
    <script>
        Auth.init();

        // Check if already logged in
        Auth.getUser().then(({ user }) => {
            if (user) window.location.href = 'index.html';
        });

        const form = document.getElementById('loginForm');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const loginBtn = document.getElementById('loginBtn');

        function showError(msg) {
            alertError.textContent = msg;
            alertError.style.display = 'block';
            alertSuccess.style.display = 'none';
        }

        function showSuccess(msg) {
            alertSuccess.textContent = msg;
            alertSuccess.style.display = 'block';
            alertError.style.display = 'none';
        }

        // ==========================================
        // Cloudflare Turnstile — protection anti-bots
        // ==========================================
        let captchaToken = null;
        let captchaReady = false;
        window.__turnstileWidgetId = null;
        window.turnstileCallback = (token) => { captchaToken = token; };
        window.turnstileExpiredCallback = () => { captchaToken = null; };
        window.turnstileErrorCallback = () => { captchaToken = null; captchaReady = false; };

        // Le captcha n'est exigé que si une vraie Site Key est configurée
        function turnstileEnabled() {
            return !!window.TURNSTILE_SITE_KEY && !window.TURNSTILE_SITE_KEY.startsWith('VOTRE_');
        }

        function waitForTurnstile(timeoutMs) {
            return new Promise((resolve) => {
                const start = Date.now();
                const check = () => {
                    if (window.turnstile && typeof window.turnstile.render === 'function') return resolve(true);
                    if (Date.now() - start > timeoutMs) return resolve(false);
                    setTimeout(check, 100);
                };
                check();
            });
        }

        // Recharger le script API s'il a échoué (réseau lent, blocage temporaire…)
        function reloadTurnstileScript() {
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.async = true;
            document.head.appendChild(s);
        }

        function renderTurnstile() {
            const id = Auth.renderTurnstile();
            captchaReady = !!id;
            if (!id) showError(t('captcha.loadError'));
        }

        async function initTurnstile() {
            if (!turnstileEnabled()) return;
            let loaded = await waitForTurnstile(8000);
            if (!loaded) reloadTurnstileScript();
            loaded = await waitForTurnstile(8000);
            if (!loaded) {
                // API indisponible (réseau) : on ne bloque pas le formulaire et
                // on réessaie en arrière-plan dès que l'API est accessible.
                console.warn('Turnstile API unavailable — captcha temporarily skipped');
                const retry = setInterval(() => {
                    if (window.turnstile && typeof window.turnstile.render === 'function') {
                        clearInterval(retry);
                        renderTurnstile();
                        if (alertError.style.display === 'block') alertError.style.display = 'none';
                    }
                }, 2000);
                setTimeout(() => clearInterval(retry), 30000);
                return;
            }
            renderTurnstile();
        }

        initTurnstile();

        // Email non confirmé : message + bouton pour renvoyer le lien de confirmation
        function showUnconfirmed(email) {
            alertError.innerHTML =
                t('login.unconfirmed') +
                '<button type="button" class="btn btn-outline" id="resendBtn" style="margin-top:12px;width:100%;">' + t('login.resend') + '</button>';
            alertError.style.display = 'block';
            alertSuccess.style.display = 'none';

            document.getElementById('resendBtn').addEventListener('click', async () => {
                const btn = document.getElementById('resendBtn');
                // Le renvoi est aussi protégé par le captcha côté Supabase
                if (turnstileEnabled()) {
                    if (!captchaReady) { alertError.textContent = t('captcha.loading'); alertError.style.display = 'block'; return; }
                    if (!captchaToken) { alertError.textContent = t('captcha.complete'); alertError.style.display = 'block'; return; }
                }
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('login.sending');
                const { error } = await Auth.resendConfirmation(email, captchaToken);
                captchaToken = null;
                Auth.resetCaptcha();
                btn.disabled = false;
                btn.innerHTML = t('login.resend');
                if (error) {
                    alertError.textContent = t('login.resendFailed') + ' : ' + (error.message || t('common.unknown'));
                    alertError.style.display = 'block';
                } else {
                    alertError.textContent = t('login.resendSent');
                    alertError.style.display = 'block';
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Turnstile requis mais non validé → bloquer la soumission
            if (turnstileEnabled()) {
                if (!captchaReady) { showError(t('captcha.loading')); return; }
                if (!captchaToken) { showError(t('captcha.complete')); return; }
            }

            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('common.connecting');
            loginBtn.disabled = true;

            const { data, error } = await Auth.signIn(email, password, captchaToken);
            console.log('Sign in result:', { data, error });

            if (error) {
                const msg = error.message || JSON.stringify(error) || t('common.unknown');
                if (msg.includes('Email not confirmed') || error.code === 'email_not_confirmed') {
                    showUnconfirmed(email);
                } else if (msg.includes('Invalid login') || msg.includes('invalid')) {
                    showError(t('login.invalid'));
                } else if (msg.includes('not initialized')) {
                    showError(t('login.configError'));
                } else {
                    showError(msg);
                }
                // Token consommé ou invalide → régénérer le captcha
                captchaToken = null;
                Auth.resetCaptcha();
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ' + t('common.signin');
                loginBtn.disabled = false;
            } else if (data.user && !Auth.isEmailConfirmed(data.user)) {
                // Session créée malgré tout → la détruire et bloquer l'accès
                await Auth.signOut(null);
                showUnconfirmed(email);
                captchaToken = null;
                Auth.resetCaptcha();
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ' + t('common.signin');
                loginBtn.disabled = false;
            } else {
                showSuccess(t('login.success'));
                localStorage.setItem('techdz-user', JSON.stringify(data.user));
                captchaToken = null;
                Auth.resetCaptcha();
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            const { error } = await Auth.signInWithGoogle();
            if (error) showError(error.message);
        });
    </script>
<script src="assets/js/effects/themes.js" defer data-base=""></script>
</body>
</html>
