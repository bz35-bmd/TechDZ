<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Code bracket icon: accolades de code (communauté de développeurs) -->
  <g transform="translate(5, 10)">
    <!-- Left bracket -->
    <path d="M12 5 L5 15 L12 25" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right bracket -->
    <path d="M28 5 L35 15 L28 25" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Slash -->
    <line x1="22" y1="3" x2="18" y2="27" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text TechDZ -->
  <text x="52" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#blueGrad)" letter-spacing="-0.5">Tech</text>
  <text x="128" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#greenGrad)" letter-spacing="-0.5">DZ</text>

  <!-- Algeria flag -->
  <rect x="190" y="16" width="42" height="28" rx="2.5" fill="#FFFFFF"/>
  <path d="M192.5 16H211v28h-18.5A2.5 2.5 0 0 1 190 41.5v-23a2.5 2.5 0 0 1 2.5-2.5z" fill="#006633"/>
  <path d="M217.06 26.5 a7 7 0 1 0 0 7 a5.6 5.6 0 1 1 0 -7" fill="#D21034"/>
  <path d="M217.33 30 L211 27.94 L214.91 33.33 V26.67 L211 32.06 Z" fill="#D21034"/>
</svg>
