<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Node-emitter icon: nœud central + ondes de signal (communauté TechDZ qui émet) -->
  <g transform="translate(9, 13)">
    <path d="M4.42 7.12 A7 7 0 0 1 17.58 7.12" stroke="url(#blueGrad)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M0.19 5.59 A11.5 11.5 0 0 1 21.81 5.59" stroke="url(#greenGrad)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M-3.1 4.06 A15 15 0 0 1 25.1 4.06" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="11" cy="9.5" r="4" fill="url(#blueGrad)"/>
    <circle cx="11" cy="9.5" r="7.5" fill="url(#blueGrad)" opacity="0.15"/>
  </g>

  <!-- Text TechDZ -->
  <text x="52" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#blueGrad)" letter-spacing="-0.5">Tech</text>
  <text x="128" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#greenGrad)" letter-spacing="-0.5">DZ</text>

  <!-- Algeria flag -->
  <rect x="190" y="16" width="42" height="28" rx="2.5" fill="#FFFFFF"/>
  <path d="M192.5 16H211v28h-18.5A2.5 2.5 0 0 1 190 41.5v-23a2.5 2.5 0 0 1 2.5-2.5z" fill="#006633"/>
  <path d="M217.06 26.5 a7 7 0 1 0 0 7 a5.6 5.6 0 1 1 0 -7" fill="#D21034"/>
  <path d="M217.33 30 L211 27.94 L214.91 33.33 V26.67 L211 32.06 Z" fill="#D21034"/>
</svg>
