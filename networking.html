    <style>
        .networking-page { padding: 100px 0 80px; min-height: 100vh; }
        .networking-header { text-align: center; max-width: 640px; margin: 0 auto 48px; }
        .networking-header h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 12px; }
        .networking-header p { color: var(--text-secondary); font-size: 1.05rem; }

        .networking-tools {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .networking-tools input,
        .networking-tools select {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
        }
        .networking-tools input { flex: 1; min-width: 200px; }
        .networking-tools input:focus,
        .networking-tools select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .member-card {
            padding: 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            text-align: center;
            transition: all 0.2s;
        }
        .member-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .member-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            margin: 0 auto 16px;
        }
        .member-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
        .member-card .member-job { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
        .member-card .member-city { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .member-card .member-city i { margin-right: 4px; }
        .member-role-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .member-role-tag.admin { background: rgba(239,68,68,0.12); color: var(--red); }
        .member-role-tag.moderator { background: rgba(245,158,11,0.12); color: var(--amber); }
        .member-role-tag.member { background: rgba(59,130,246,0.12); color: var(--primary); }

        .member-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .member-skill-tag {
            padding: 3px 10px;
            background: rgba(59,130,246,0.08);
            border: 1px solid rgba(59,130,246,0.15);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--primary);
        }
        .member-contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            transition: all 0.2s;
        }
        .member-contact-btn:hover { opacity: 0.9; }

        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.3; display: block; }
        .members-count { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; }

        @media (max-width: 768px) {
            .members-grid { grid-template-columns: 1fr; }
            .networking-tools { flex-direction: column; }
            .networking-tools input { min-width: auto; }
        }
    </style>
</head>

    <div class="networking-page">
        <div class="container">
            <div class="networking-header">
                <h1><span data-i18n="nav.networking">Réseautage</span> <span class="text-gradient">TechDZ</span></h1>
                <p data-i18n="networking.pageSubtitle">Connectez-vous avec les professionnels IT en Algérie</p>
            </div>

            <div class="online-now" id="onlineNowSection" style="display:none;">
                <div class="online-now-header">
                    <span class="online-pulse"><span></span></span>
                    <h2 data-i18n="online.now">En ligne maintenant</h2>
                    <span class="online-now-count" id="onlineNowCount">0</span>
                </div>
                <div class="online-now-list" id="onlineNowList"></div>
            </div>

            <div class="networking-tools">
                <input type="text" id="searchInput" placeholder="Rechercher un membre..." data-i18n-placeholder="networking.searchPlaceholder">
                <select id="cityFilter">
                    <option value="" data-i18n="networking.allCities">Toutes les villes</option>
                </select>
                <select id="skillFilter">
                    <option value="" data-i18n="networking.allSkills">Tous les domaines</option>
                </select>
            </div>

            <div class="members-count" id="membersCount"></div>
            <div id="membersGrid" class="members-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="networking.loading">Chargement des membres...</span></div>
            </div>
        </div>

    <script src="db.js?v=20260807"></script>
    <script src="script.js?v=20260807"></script>

    <script src="widgets.js?v=20260807"></script>
    <script>
        (async () => {
            Auth.init();
            let currentUser = null;
            const { user } = await Auth.getUser();
            if (user && !Auth.isEmailConfirmed(user)) {
                await Auth.signOut('login.html');
                return;
            }
            if (user) {
                currentUser = user;
                document.getElementById('authLoggedOut').style.display = 'none';
                document.getElementById('authLoggedIn').style.display = 'flex';
            }

            const grid = document.getElementById('membersGrid');
            const countEl = document.getElementById('membersCount');
            const searchInput = document.getElementById('searchInput');
            const cityFilter = document.getElementById('cityFilter');
            const skillFilter = document.getElementById('skillFilter');

            function truncate(str, len) {
                return str && str.length > len ? str.substring(0, len) + '...' : str;
            }

            function getInitials(name) {
                return (name || 'U').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            }

            async function loadCities() {
                const { data } = await DB.getMemberCities();
                if (data && data.length > 0) {
                    cityFilter.innerHTML = `<option value="">${t('networking.allCities')}</option>` +
                        data.map(c => `<option value="${c}">${c}</option>`).join('');
                }
            }

            async function loadSkills() {
                const { data } = await DB.getMemberSkills();
                if (data && data.length > 0) {
                    skillFilter.innerHTML = `<option value="">${t('networking.allSkills')}</option>` +
                        data.map(s => `<option value="${s}">${s}</option>`).join('');
                }
            }

            async function loadMembers() {
                const search = searchInput.value.trim();
                const city = cityFilter.value;
                const skill = skillFilter.value;

                const { data, error, count } = await DB.getMembers({ search, city });

                if (error) {
                    grid.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>${t('common.error')}: ${error.message}</p></div>`;
                    countEl.textContent = '';
                    return;
                }

                const noun = (count || 0) > 1 ? ' ' + t('networking.foundMany') : ' ' + t('networking.foundOne');
                countEl.textContent = data && data.length > 0 ? `${count || data.length}${noun}` : '';

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><p>' + t('networking.empty') + '</p></div>';
                    return;
                }

                // Filter by skill client-side
                let filtered = data;
                if (skill) {
                    filtered = data.filter(m => (m.skills || []).some(s => s.toLowerCase() === skill.toLowerCase()));
                    countEl.textContent = `${filtered.length}${filtered.length > 1 ? ' ' + t('networking.foundMany') : ' ' + t('networking.foundOne')}`;
                    if (filtered.length === 0) {
                        grid.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><p>' + t('networking.emptyDomain') + '</p></div>';
                        return;
                    }
                }

                // Tri : en ligne en premier (par dernière activité), puis hors ligne
                const onlineIds = (window.Online && window.Online.userSet) || new Set();
                filtered = [...filtered].sort((a, b) => {
                    const aOn = onlineIds.has(a.id) ? 1 : 0;
                    const bOn = onlineIds.has(b.id) ? 1 : 0;
                    if (aOn !== bOn) return bOn - aOn;
                    const aT = a.last_active ? new Date(a.last_active).getTime() : 0;
                    const bT = b.last_active ? new Date(b.last_active).getTime() : 0;
                    return bT - aT;
                });

                let lastSection = '';
                grid.innerHTML = filtered.map(m => {
                    const online = onlineIds.has(m.id);
                    let separator = '';
                    if (online && lastSection !== 'online') {
                        separator = `<div class="members-section-sep"><i class="fas fa-circle online-sep-dot"></i>${t('online.online', 'En ligne')}</div>`;
                        lastSection = 'online';
                    } else if (!online && lastSection === 'online') {
                        separator = `<div class="members-section-sep offline">${t('online.offline', 'Hors ligne')}</div>`;
                        lastSection = 'offline';
                    }
                    const roleLabel = m.role === 'admin' ? t('common.admin') : m.role === 'moderator' ? t('common.moderator') : t('common.member');
                    const skills = m.skills || [];
                    return `
                        ${separator}
                        <div class="member-card ${online ? 'is-online' : ''}">
                            ${online ? '<span class="online-card-dot"><span></span></span>' : ''}
                            <div class="member-avatar">${getInitials(m.full_name)}</div>
                            <span class="member-role-tag ${m.role || 'member'}">${roleLabel}</span>
                            <h3>${m.full_name || t('common.user')}</h3>
                            <div class="member-job">${m.job_title || ''}</div>
                            ${m.city ? `<div class="member-city"><i class="fas fa-map-marker-alt"></i>${m.city}</div>` : ''}
                            ${skills.length > 0 ? `
                            <div class="member-skills">
                                ${skills.map(s => `<span class="member-skill-tag">${s}</span>`).join('')}
                            </div>` : ''}
                        </div>
                    `;
                }).join('');
            }

            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(loadMembers, 300);
            });
            cityFilter.addEventListener('change', loadMembers);
            skillFilter.addEventListener('change', loadMembers);

            await Promise.all([loadCities(), loadSkills(), loadMembers()]);

            let onlineRefreshTimer;
            document.addEventListener('online-updated', () => {
                clearTimeout(onlineRefreshTimer);
                onlineRefreshTimer = setTimeout(loadMembers, 400);
            });
        })();
    </script>
<script src="assets/themes.js" defer data-base=""></script>
