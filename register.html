<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.register">Inscription — TechDZ</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .auth-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            filter: blur(60px);
        }
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 48px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo img { height: 36px; }
        .auth-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 12px;
        }
        .auth-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-group input {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .form-group .error-text {
            color: var(--red);
            font-size: 0.8rem;
            display: none;
        }
        .form-group.error input { border-color: var(--red); }
        .form-group.error .error-text { display: block; }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: var(--border-color);
            margin-top: 4px;
            overflow: hidden;
        }
        .password-strength .bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .password-strength .bar.weak { width: 33%; background: var(--red); }
        .password-strength .bar.medium { width: 66%; background: var(--amber); }
        .password-strength .bar.strong { width: 100%; background: var(--secondary); }
        .terms {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
        .terms a { color: var(--primary); }
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            display: none;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--red);
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--secondary);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> <span data-i18n="common.back">Retour</span>
    </a>
<div class="theme-picker theme-picker-fixed">
    <button class="theme-picker-btn" id="themePickerBtn" aria-label="Choisir le thème" data-i18n-aria="theme.choose" aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-palette"></i>
    </button>
    <div class="theme-picker-menu" id="themePickerMenu" role="menu">
        <div class="theme-picker-header" data-i18n="theme.title">Thème du site</div>
        <button class="theme-option" data-theme-option="code" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-code"></span>
            <span class="theme-option-text"><strong data-i18n="theme.code">Code</strong><small data-i18n="theme.codeDesc">Encre liquide + &lt;/&gt;</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="signal" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-signal"></span>
            <span class="theme-option-text"><strong data-i18n="theme.signal">Signal</strong><small data-i18n="theme.signalDesc">Réseau + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="fusion" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-fusion"></span>
            <span class="theme-option-text"><strong data-i18n="theme.fusion">Fusion</strong><small data-i18n="theme.fusionDesc">Encre + nœud</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="dunes" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-dunes"></span>
            <span class="theme-option-text"><strong data-i18n="theme.dunes">Dunes</strong><small data-i18n="theme.dunesDesc">Sahara + réseau or</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
        <button class="theme-option" data-theme-option="nuit" role="menuitemradio" aria-checked="false">
            <span class="theme-swatch swatch-nuit"></span>
            <span class="theme-option-text"><strong data-i18n="theme.nuit">Nuit</strong><small data-i18n="theme.nuitDesc">Étoiles + réseau indigo</small></span>
            <i class="fas fa-check theme-check"></i>
        </button>
    </div>
</div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="logo.svg" alt="TechDZ">
                <h1 data-i18n="register.title">Créer un compte</h1>
                <p data-i18n="register.subtitle">Rejoignez la communauté IT d'Algérie</p>
            </div>

            <div class="alert error" id="alertError"></div>
            <div class="alert success" id="alertSuccess"></div>

            <form class="auth-form" id="registerForm">
                <div class="form-group" id="nameGroup">
                    <label for="fullName" data-i18n="profile.nameLabel">Nom complet</label>
                    <input type="text" id="fullName" placeholder="Mohamed Benali" required>
                    <span class="error-text"></span>
                </div>
                <div class="form-group" id="emailGroup">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com" required>
                    <span class="error-text"></span>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="password" data-i18n="common.password">Mot de passe</label>
                    <input type="password" id="password" data-i18n-placeholder="register.minChars" placeholder="Minimum 6 caractères" required minlength="6">
                    <div class="password-strength">
                        <div class="bar" id="strengthBar"></div>
                    </div>
                    <span class="error-text"></span>
                </div>
                <div class="form-group" id="confirmGroup">
                    <label for="confirmPassword" data-i18n="register.confirm">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" data-i18n-placeholder="register.confirmPlaceholder" placeholder="Répétez le mot de passe" required>
                    <span class="error-text"></span>
                </div>
                <div id="turnstile-widget"></div>
                <p class="terms">
                    <span data-i18n="register.terms1">En créant un compte, vous acceptez nos</span> <a href="#" data-i18n="register.termsLink">conditions d'utilisation</a>
                </p>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="registerBtn">
                    <i class="fas fa-user-plus"></i> <span data-i18n="register.submit">Créer mon compte</span>
                </button>
            </form>

            <div class="auth-footer">
                <span data-i18n="register.haveAccount">Déjà un compte ?</span> <a href="login.html" data-i18n="register.login">Se connecter</a>
            </div>
        </div>
    </div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js?v=20260807"></script>
    <script src="translations.js?v=20260807"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || localStorage.getItem('techdz-lang') || 'fr';
            localStorage.setItem('techdz-lang', lang);
            const tr = window.translations;
            const data = (tr && tr[lang]) || (tr && tr.fr) || {};
            if (lang === 'ar') document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', lang);
            const apply = (attr, set) => document.querySelectorAll('[' + attr + ']').forEach(el => {
                const k = el.getAttribute(attr);
                if (data[k]) set(el, data[k]);
            });
            apply('data-i18n', (el, v) => el.textContent = v);
            apply('data-i18n-placeholder', (el, v) => el.placeholder = v);
            apply('data-i18n-title', (el, v) => el.title = v);
            apply('data-i18n-aria', (el, v) => el.setAttribute('aria-label', v));
            window.t = function (key, fb) {
                const v = data[key];
                return (v !== undefined && v !== null && v !== '') ? v : (fb !== undefined ? fb : key);
            };
        })();
    </script>
    <script src="db.js?v=20260807"></script>
    <script>
        Auth.init();

        // Check if already logged in
        Auth.getUser().then(({ user }) => {
            if (user) window.location.href = 'index.html';
        });

        // Pre-fill from URL params (from CTA form)
        const urlParams = new URLSearchParams(window.location.search);
        const preName = urlParams.get('name');
        const preEmail = urlParams.get('email');
        if (preName) document.getElementById('fullName').value = preName;
        if (preEmail) document.getElementById('email').value = preEmail;

        const form = document.getElementById('registerForm');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const registerBtn = document.getElementById('registerBtn');
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');

        function showError(msg) {
            alertError.textContent = msg;
            alertError.style.display = 'block';
            alertSuccess.style.display = 'none';
        }

        function showSuccess(msg) {
            alertSuccess.textContent = msg;
            alertSuccess.style.display = 'block';
            alertError.style.display = 'none';
        }

        // ==========================================
        // Cloudflare Turnstile — protection anti-bots
        // ==========================================
        let captchaToken = null;
        let captchaReady = false;
        window.__turnstileWidgetId = null;
        window.turnstileCallback = (token) => { captchaToken = token; };
        window.turnstileExpiredCallback = () => { captchaToken = null; };
        window.turnstileErrorCallback = () => { captchaToken = null; captchaReady = false; };

        // Le captcha n'est exigé que si une vraie Site Key est configurée
        function turnstileEnabled() {
            return !!window.TURNSTILE_SITE_KEY && !window.TURNSTILE_SITE_KEY.startsWith('VOTRE_');
        }

        function waitForTurnstile(timeoutMs) {
            return new Promise((resolve) => {
                const start = Date.now();
                const check = () => {
                    if (window.turnstile && typeof window.turnstile.render === 'function') return resolve(true);
                    if (Date.now() - start > timeoutMs) return resolve(false);
                    setTimeout(check, 100);
                };
                check();
            });
        }

        // Recharger le script API s'il a échoué (réseau lent, blocage temporaire…)
        function reloadTurnstileScript() {
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.async = true;
            document.head.appendChild(s);
        }

        function renderTurnstile() {
            const id = Auth.renderTurnstile();
            captchaReady = !!id;
            if (!id) showError(t('captcha.loadError'));
        }

        async function initTurnstile() {
            if (!turnstileEnabled()) return;
            let loaded = await waitForTurnstile(8000);
            if (!loaded) reloadTurnstileScript();
            loaded = await waitForTurnstile(8000);
            if (!loaded) {
                // API indisponible (réseau) : on ne bloque pas le formulaire et
                // on réessaie en arrière-plan dès que l'API est accessible.
                console.warn('Turnstile API unavailable — captcha temporarily skipped');
                const retry = setInterval(() => {
                    if (window.turnstile && typeof window.turnstile.render === 'function') {
                        clearInterval(retry);
                        renderTurnstile();
                        if (alertError.style.display === 'block') alertError.style.display = 'none';
                    }
                }, 2000);
                setTimeout(() => clearInterval(retry), 30000);
                return;
            }
            renderTurnstile();
        }

        initTurnstile();

        // Password strength
        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;

            strengthBar.className = 'bar';
            if (strength === 1) strengthBar.classList.add('weak');
            else if (strength === 2) strengthBar.classList.add('medium');
            else if (strength >= 3) strengthBar.classList.add('strong');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Turnstile requis mais non validé → bloquer la soumission
            if (turnstileEnabled()) {
                if (!captchaReady) { showError(t('captcha.loading')); return; }
                if (!captchaToken) { showError(t('captcha.complete')); return; }
            }

            // Validate
            if (password !== confirmPassword) {
                showError(t('register.mismatch'));
                return;
            }

            if (password.length < 6) {
                showError(t('register.shortPassword'));
                return;
            }

            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('register.creating');
            registerBtn.disabled = true;

            const { data, error } = await Auth.signUp(email, password, fullName, captchaToken);
            console.log('Sign up result:', JSON.stringify({ data, error }));

            if (error) {
                let msg = '';
                if (error.message) msg = error.message;
                else if (error.error_description) msg = error.error_description;
                else if (error.msg) msg = error.msg;
                else if (typeof error === 'string') msg = error;
                else msg = t('register.errorPrefix') + ': ' + JSON.stringify(error);

                console.log('Error message:', msg);

                if (msg.includes('already registered') || msg.includes('already been registered')) {
                    showError(t('register.emailUsed'));
                } else if (msg.includes('valid email')) {
                    showError(t('register.invalidEmail'));
                } else if (msg.includes('not initialized') || msg.includes('not loaded')) {
                    showError(t('register.configReload'));
                } else {
                    showError(msg);
                }
                // Token consommé ou invalide → régénérer le captcha
                captchaToken = null;
                Auth.resetCaptcha();
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> ' + t('register.submit');
                registerBtn.disabled = false;
            } else if (data.user && !Auth.isEmailConfirmed(data.user)) {
                // Email non confirmé → message clair, pas de redirection immédiate
                showSuccess(t('register.success').replace('{email}', email));
                captchaToken = null;
                Auth.resetCaptcha();
                registerBtn.innerHTML = '<i class="fas fa-check"></i> ' + t('register.emailSent');
                registerBtn.disabled = true;
                form.querySelectorAll('input').forEach(i => i.disabled = true);
            } else {
                showSuccess(t('register.created2'));
                captchaToken = null;
                Auth.resetCaptcha();
                registerBtn.innerHTML = '<i class="fas fa-check"></i> ' + t('register.accountCreated');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            }
        });
    </script>
<script src="assets/themes.js" defer data-base=""></script>
</body>
</html>
